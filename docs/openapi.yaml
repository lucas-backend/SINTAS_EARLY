  /api/v1/banners:
    get:
      {
        tags: [Banner],
        security: [{ cookieAuth: [] }],
        responses: { "200": { $ref: "#/components/responses/Data" } },
      }
    post:
      {
        tags: [Banner],
        security: [{ cookieAuth: [] }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
