        responses: { "200": { $ref: "#/components/responses/Data" } },
      }
    post:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        requestBody: { $ref: "#/components/requestBodies/Class" },
        responses:
          {
