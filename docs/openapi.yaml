openapi: 3.0.3
info:
  title: SINTAS API
  version: 1.0.0
  description: REST API untuk absensi sekolah. Semua timestamp API menggunakan ISO 8601.
servers:
  - url: /
tags:
  - name: Health
  - name: Auth
  - name: Academic
  - name: Banner
  - name: Attendance
  - name: Report
  - name: User
paths:
  /health/live:
    get:
      tags: [Health]
      responses:
        "200":
          {
            description: Process hidup,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/DataResponse" } },
              },
          }
  /health/ready:
    get:
      tags: [Health]
      responses:
        "200": { description: Database siap }
        "503":
          {
            description: Database belum siap,
            content: {
              application/json: {
                schema: { $ref: "#/components/schemas/ErrorResponse" },
              },
            },
          }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LoginRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Login berhasil,
            headers: { Set-Cookie: { schema: { type: string } } },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      responses:
        "200":
          {
            description: Logout berhasil,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/DataResponse" },
                  },
              },
          }
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/ForgotPasswordRequest" },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "400": { $ref: "#/components/responses/ValidationError" },
        }
  /api/v1/me:
    get:
      tags: [Auth]
      security: [{ cookieAuth: [] }]
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }
    patch:
      tags: [Auth]
      security: [{ cookieAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ProfileRequest" } },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }
  /api/v1/academic/education-levels:
    get:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
    post:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        requestBody: { $ref: "#/components/requestBodies/Name" },
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/academic/education-levels/{id}:
    patch:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        requestBody: { $ref: "#/components/requestBodies/Name" },
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
