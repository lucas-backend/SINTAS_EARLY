            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/academic/subjects:
    get:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        responses: { "200": { $ref: "#/components/responses/Data" } },
      }
    post:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        requestBody: { $ref: "#/components/requestBodies/Name" },
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/academic/subjects/{id}:
    patch:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        requestBody: { $ref: "#/components/requestBodies/Name" },
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
    delete:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/academic/memberships:
    get:
      {
        tags: [Academic],
        security: [{ cookieAuth: [] }],
        description: "ADMIN. Filter opsional classId dan/atau studentId (query strict).",
        responses: { "200": { $ref: "#/components/responses/Data" }, "403": { $ref: "#/components/responses/Forbidden" } },
      }
    post:
      {
        tags: [Academic],
