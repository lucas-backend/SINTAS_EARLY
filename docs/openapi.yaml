        security: [{ cookieAuth: [] }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/banners/{id}:
    patch:
      {
        tags: [Banner],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
    delete:
      {
        tags: [Banner],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/attendance-sessions:
    get:
      {
        tags: [Attendance],
        security: [{ cookieAuth: [] }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
    post:
      {
        tags: [Attendance],
        security: [{ cookieAuth: [] }],
        description: "ADMIN only (D22/J1); guru tidak membuat sesi (403). Teacher hanya membaca sesi miliknya via GET.",
        requestBody: { $ref: "#/components/requestBodies/Session" },
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/attendance-sessions/{id}:
    patch:
      {
        tags: [Attendance],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
    delete:
      {
        tags: [Attendance],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/attendance-sessions/{id}/qr:
    get:
      tags: [Attendance]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /api/v1/attendance-sessions/{id}/roster:
    get:
      tags: [Attendance]
      security: [{ cookieAuth: [] }]
      description: Roster siswa satu sesi dengan status teresolusi (scan/override/computed). TEACHER dibatasi assignment aktif miliknya.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /api/v1/attendance-status-overrides:
    post:
      tags: [Attendance]
      security: [{ cookieAuth: [] }]
      description: "TEACHER only. Status manual IZIN/SAKIT/ALFA/DISPEN; HADIR/TERLAMBAT/TIDAK_HADIR ditolak 400; siswa sudah scan ditolak 409."
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [sessionId, studentId, status],
                      properties:
                        {
                          sessionId: { type: integer },
                          studentId: { type: integer },
                          status:
                            {
                              type: string,
                              enum: [IZIN, SAKIT, ALFA, DISPEN],
                            },
                        },
                    },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "400": { $ref: "#/components/responses/ValidationError" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/attendance-status-overrides/{sessionId}/{studentId}:
    delete:
      tags: [Attendance]
      security: [{ cookieAuth: [] }]
      description: TEACHER only. Menghapus override sehingga status kembali ke scan/computed.
      parameters:
        [
          { $ref: "#/components/parameters/SessionId" },
          { $ref: "#/components/parameters/StudentId" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /api/v1/attendance-scans:
    post:
      tags: [Attendance]
      security: [{ cookieAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [qrPayload],
                      properties: { qrPayload: { type: string } },
                    },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/attendance/history:
    get:
      {
        tags: [Attendance],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/ReportQuery" }],
        responses: { "200": { $ref: "#/components/responses/Data" } },
      }
  /api/v1/attendance/today:
    get:
      {
        tags: [Attendance],
        security: [{ cookieAuth: [] }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/attendance/classes/{id}:
    get:
      tags: [Attendance]
      security: [{ cookieAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Id" },
          { $ref: "#/components/parameters/ReportQuery" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
  /api/v1/reports/attendance:
    get:
      {
        tags: [Report],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/ReportQuery" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/reports/attendance/export:
    get:
      tags: [Report]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ReportQuery" }]
      responses:
        "200":
          description: Workbook ExcelJS berisi kolom yang dikunci di docs/DECISIONS.md.
          headers: { Content-Disposition: { schema: { type: string } } }
          content:
            {
              application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
                { schema: { type: string, format: binary } },
            }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          {
            description: Tidak ada data untuk diekspor,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
        "429":
          {
            description: Export sedang penuh,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/reports/attendance/daily:
    get:
      tags: [Report]
      security: [{ cookieAuth: [] }]
      description: TEACHER only. Rekap siswa tidak masuk pada satu tanggal sekolah.
      parameters:
        [
          {
            name: date,
            in: query,
            required: true,
            schema: { type: string, format: date },
          },
          { $ref: "#/components/parameters/ClassIdQuery" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
  /api/v1/reports/attendance/summary:
    get:
      tags: [Report]
      security: [{ cookieAuth: [] }]
      description: TEACHER only. Rekap H.I.S.A.D per siswa dalam scope assignment guru.
      parameters: [{ $ref: "#/components/parameters/ClassIdQuery" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
  /api/v1/users:
    get:
      {
        tags: [User],
        security: [{ cookieAuth: [] }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
    post:
      {
        tags: [User],
        security: [{ cookieAuth: [] }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
  /api/v1/users/{id}:
    patch:
      {
        tags: [User],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
    delete:
      {
        tags: [User],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Data" },
            "400": { $ref: "#/components/responses/ValidationError" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
  /api/v1/users/{id}/password:
    patch:
      tags: [User]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Data" },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: auth_token }
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1 },
      }
    ReportQuery:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: Filter tambahan `to`, `status`, `classId`, `assignmentId`, `page`, `limit`, `sort`, dan `order` mengikuti attendanceReportQuerySchema.
    SessionId:
      {
        name: sessionId,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1 },
      }
    StudentId:
      {
        name: studentId,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1 },
      }
    ClassIdQuery:
      {
        name: classId,
        in: query,
        required: false,
        schema: { type: integer, minimum: 1 },
      }
  requestBodies:
    Name:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [name],
                    properties: { name: { type: string } },
                  },
              },
          },
      }
    Class:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [name, educationLevelId],
                    properties:
                      {
                        name: { type: string },
                        educationLevelId: { type: integer },
                      },
                  },
              },
          },
      }
    Session:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required:
                      [classId, subjectId, teacherId, sessionDate, startAt, endAt, timezone],
                    properties:
                      {
                        classId: { type: integer },
                        subjectId: { type: integer },
                        teacherId: { type: integer },
                        sessionDate: { type: string, format: date },
                        startAt: { type: string, format: date-time },
                        endAt: { type: string, format: date-time },
                        timezone: { type: string },
                      },
                  },
              },
          },
      }
  schemas:
    DataResponse:
      { type: object, required: [data], properties: { data: { type: object } } }
    ErrorResponse:
      {
